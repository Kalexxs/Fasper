<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Login - FASPER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="brand">
                <div class="logo">F</div>
                <h1>FASPER Marketplace</h1>
            </div>
  
    </header>

    <main class="container page">
        <div class="box hero" style="max-width: 500px; margin: 0 auto;">
            <h2 style="text-align: center;">Login</h2>
            <p style="text-align: center; margin-bottom: 30px;">Acesse sua conta no FASPER</p>
            
            <div id="msgLogin" style="min-height: 50px;"></div>
            
            <form id="loginForm">
                <div class="field">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required autocomplete="email">
                </div>
                
                <div class="field">
                    <label>Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                </div>
                
                <div class="actions" style="justify-content: center;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                </div>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <a href="cadastro.html"> Não tem conta? Cadastre-se</a>
                <br>
                <a href="#" id="esqueciSenha" style="display: inline-block; margin-top: 10px;"> Esqueci minha senha</a>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
