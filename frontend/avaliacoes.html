  <main class="container page activity4-grid">
    <section class="box panel">
      <span class="tag-entrega">Atividade 4 do cronograma</span><h2>Avaliação de produto</h2><p>RF8: registro da nota e comentário do cliente após a compra.</p>
      <form id="avaliacaoForm" class="form-grid" novalidate>
        <div class="field full"><label for="avaliacaoProduto">Produto comprado</label><select id="avaliacaoProduto" required></select></div>
        <div class="field"><label for="avaliacaoNota">Nota</label><select id="avaliacaoNota"><option value="5">5 - Excelente</option><option value="4">4 - Muito bom</option><option value="3">3 - Bom</option><option value="2">2 - Regular</option><option value="1">1 - Ruim</option></select></div>
        <div class="field"><label for="avaliacaoCliente">Cliente</label><input id="avaliacaoCliente" placeholder="Nome do cliente" required></div>
        <div class="field full"><label for="avaliacaoComentario">Comentário</label><textarea id="avaliacaoComentario" placeholder="Descreva sua experiência com o produto" required></textarea></div>
        <div class="actions"><button class="btn btn-primary" type="submit">Salvar avaliação</button><button class="btn btn-secondary" type="button" id="btnExportarAvaliacoes">Gerar Excel</button></div><div id="msgAvaliacao" class="msg"></div>
      </form>
    </section>
    <aside class="box activity4-side-panel"><h3>Avaliações registradas</h3><div id="listaAvaliacoes" class="activity4-list"></div></aside>
  </main>
