<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <div class="logo">F</div>
        <h1>FASPER Marketplace</h1>
      </a>

      <button class="nav-toggle" id="btnNavToggle" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="navPrincipal">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" id="navPrincipal">
        <a href="index.html">Início</a>
        <a class="active" href="cadastro.html">Cadastro</a>
        <a href="vendedor.html">Vendedor</a>
        <!-- Atividade 2 do cronograma -->
        <a href="produtos.html">Produtos</a>
        <!-- Atividade 2 do cronograma -->
        <a href="lista-produtos.html">Lista de produtos</a>
        <!-- Atividade 3 do cronograma -->
        <a href="carrinho.html">Carrinho <span class="cart-badge" data-cart-count>0</span></a>
        <!-- Atividade 3 do cronograma -->
        <a href="pedido.html">Pedido</a>
        <!-- Atividade 4 do cronograma -->
        <a href="historico.html">Histórico</a>
        <!-- Atividade 4 do cronograma -->
        <a href="avaliacoes.html">Avaliações</a>
        <!-- Atividade 4 do cronograma -->
        <a href="mensagens.html">Mensagens</a>
        <a href="resumo.html">Resumo</a>
      </nav>
    </div>
    <button id="btnSair" style="position: fixed; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; z-index: 9999;">
    SAIR
</button>
  </header>

  <main class="container page">
    <section class="box panel">
      <h2>Cadastro de usuário</h2>
      <p>Preencha os dados abaixo.</p>

      <form id="cadastroForm" class="form-grid" novalidate>
        <div class="field">
          <label for="nome" class="obrigatorio">Nome completo</label>
          <input id="nome" required>
        </div>

        <div class="field">
          <label for="email" class="obrigatorio">E-mail</label>
          <input id="email" type="email" required>
        </div>

        <div class="field">
          <label for="senha" class="obrigatorio">Senha</label>
          <input id="senha" type="password" required>
        </div>

        <div class="field">
          <label for="tipo">Tipo de conta</label>
          <select id="tipo">
             <option value="comprador">Comprador</option>
  <option value="vendedor">Vendedor</option>
          </select>
        </div>

        <div class="field full">
          <label for="observacao">Observação</label>
          <textarea id="observacao"></textarea>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Salvar e continuar</button>
          <a class="btn btn-secondary" href="resumo.html">Resumo</a>
        </div>

        <div id="msg" class="msg"></div>
      </form>
    </section>
  </main>

   <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
