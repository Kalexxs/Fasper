<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>FASPER | Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container header-inner">
            <div class="brand">
                <div class="logo">F</div>
                <h1>FASPER Marketplace</h1>
            </div>
            <nav class="nav"><a class="" href="index.html">Início</a><a class="active"
                    href="cadastro.html">Cadastro</a><a class="" href="vendedor.html">Vendedor</a><a class=""
                    href="resumo.html">Resumo</a></nav>
        </div>
    </header>
    <main class="container page">
        <section class="box panel">
            <h2>Cadastro de usuário</h2>
            <p>Preencha os dados abaixo.</p>
            <form id="cadastroForm" class="form-grid">
                <div class="field"><label>Nome completo</label><input id="nome" required></div>
                <div class="field"><label>E-mail</label><input id="email" type="email" required></div>
                <div class="field"><label>Senha</label><input id="senha" type="password" required></div>
                <div class="field"><label>Tipo de conta</label><select id="tipo">
                        <option>Comprador</option>
                        <option>Vendedor</option>
                    </select></div>
                <div class="field full"><label>Observação</label><textarea id="observacao"></textarea></div>
                <div class="actions"><button class="btn btn-primary" type="submit">Salvar e continuar</button><a
                        class="btn btn-secondary" href="resumo.html">Resumo</a></div>
                <div id="msg" class="msg"></div>
            </form>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
