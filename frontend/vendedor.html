      <button class="nav-toggle" id="btnNavToggle" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="navPrincipal">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" id="navPrincipal">
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a class="active" href="vendedor.html">Vendedor</a>
        <!-- Atividade 2 do cronograma -->
        <a href="produtos.html">Produtos</a>
        <!-- Atividade 2 do cronograma -->
        <a href="lista-produtos.html">Lista de produtos</a>
        <!-- Atividade 3 do cronograma -->
        <a href="carrinho.html">Carrinho <span class="cart-badge" data-cart-count>0</span></a>
        <!-- Atividade 3 do cronograma -->
        <a href="pedido.html">Pedido</a>
        <!-- Atividade 4 do cronograma -->
        <a href="historico.html">Histórico</a>

    </div>
    <button id="btnSair" style="position: fixed; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; z-index: 9999;">
    SAIR
</button>
  </header>

  <main class="container page">
    <section class="box panel">
      <h2>Perfil do vendedor</h2>
      <p>Dados da loja.</p>

      <form id="vendedorForm" class="form-grid" novalidate>
        <div class="field">
          <label for="loja" class="obrigatorio">Nome da loja</label>
          <input id="loja" required>
        </div>

        <div class="field">
          <label for="contato" class="obrigatorio">Contato</label>
          <input id="contato" required>
        </div>

        <div class="field full">
          <label for="imagem">Imagem da loja (URL local opcional)</label>
          <input id="imagem" placeholder="Ex.: imagens/minha-loja.png">
        </div>

        <div class="field full">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" required></textarea>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">Salvar</button>
          <a class="btn btn-secondary" href="cadastro.html">Voltar</a>
        </div>

        <div id="msg" class="msg"></div>
      </form>
    </section>
  </main>

    <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
