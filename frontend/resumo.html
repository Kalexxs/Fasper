<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASPER | Resumo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">F</div>
        <h1>FASPER Marketplace</h1>
      </div>

      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="vendedor.html">Vendedor</a>
        <!-- Atividade 2 do cronograma -->
        <a href="produtos.html">Produtos</a>
        <a href="lista-produtos.html">Lista de produtos</a>
        <a class="active" href="resumo.html">Resumo</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <section class="box panel">
      <div class="header-card">
        <div>
          <h2>Resumo</h2>
          <p>Prévia dos dados cadastrados nas entregas 1 e 2.</p>
        </div>
        <span class="status">Pronto</span>
      </div>

      <div class="summary">
        <div class="row"><strong>Nome</strong><span id="r_nome">-</span></div>
        <div class="row"><strong>E-mail</strong><span id="r_email">-</span></div>
        <div class="row"><strong>Tipo</strong><span id="r_tipo">-</span></div>
        <div class="row"><strong>Loja</strong><span id="r_loja">-</span></div>
        <div class="row"><strong>Contato</strong><span id="r_contato">-</span></div>
        <div class="row"><strong>Descrição</strong><span id="r_descricao">-</span></div>
        <!-- Atividade 2 do cronograma: resumo simples do módulo de produtos -->
        <div class="row"><strong>Total de produtos</strong><span id="r_total_produtos">0</span></div>
        <div class="row"><strong>Último produto</strong><span id="r_ultimo_produto">-</span></div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="cadastro.html">Editar</a>
        <a class="btn btn-secondary" href="index.html">Voltar</a>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
